<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEYOND THE FRAME — 2026 시각디자인 졸업전시</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500&display=swap">
  <style>

*{box-sizing:border-box}
:root{
  --ink:#2e261d;--ink-soft:#6b5d4b;--cream:#f4efe6;--paper:#fbf8f2;--sand:#e8dcc8;
  --gold:#a8824c;--gold-hi:#d8b77e;--night:#16110b;
  --glass:rgba(252,248,240,.66);--glass-line:rgba(120,96,64,.2);

  --g-bg:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
  --g-bg-hi:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.18));
  --g-line:rgba(255,255,255,.46);
  --g-blur:blur(18px) saturate(1.2);
  --g-shadow:0 10px 30px rgba(60,40,20,.14),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(255,255,255,.12);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --tw:min(84vw,1240px);
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.screen{position:fixed;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.screen.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92vw,520px);padding:12px 20px;border-radius:12px;background:rgba(46,34,22,.92);color:#f3eadb;font-size:12.5px;line-height:1.7;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.veil{position:fixed;inset:0;z-index:80;background:#f7ecd9;opacity:0;pointer-events:none;transition:opacity .55s ease}
.veil.on{opacity:1}
.screen.instant,.screen.instant.on{transition:none!important}

.intro-frame{background:#1b1915;cursor:pointer}
.if-light{position:absolute;inset:0;background:radial-gradient(ellipse 52% 62% at 50% 44%,rgba(226,204,163,.14),transparent 70%);pointer-events:none}
.if-floor{position:absolute;bottom:-15%;left:-10%;width:120%;height:38%;background:linear-gradient(#211e18,#141310);transform:perspective(400px) rotateX(13deg);transform-origin:top;border-top:1px solid rgba(233,228,218,.05)}
.if-grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.13;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
.if-frame{position:absolute;z-index:3;left:50%;top:50%;width:min(700px,calc(100vw - 44px));height:min(460px,calc(100svh - 70px));min-height:360px;transform:translate(-50%,-50%);
  border:7px solid rgba(226,204,163,.99);pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,239,203,.68),inset 0 0 0 6px rgba(168,137,88,.72),inset 0 0 0 10px rgba(226,204,163,.22),inset 0 0 34px rgba(226,204,163,.08),0 0 0 2px rgba(0,0,0,.58),0 0 0 5px rgba(226,204,163,.12),0 0 26px rgba(226,204,163,.2),0 0 58px rgba(199,182,154,.09);
  transition:opacity .18s .04s,transform .5s .04s,box-shadow .3s,border-color .25s}
.if-frame::before,.if-frame::after{content:"";position:absolute;width:66px;height:66px;border-color:#f5dfb2;border-style:solid;filter:drop-shadow(0 0 8px rgba(240,217,173,.38))}
.if-frame::before{top:-7px;left:-7px;border-width:7px 0 0 7px}
.if-frame::after{right:-7px;bottom:-7px;border-width:0 7px 7px 0}
.if-orn{position:absolute;inset:13px;border:1px solid rgba(240,217,173,.55)}
.if-orn::before,.if-orn::after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);color:#f0d9ad;font-size:17px;line-height:1;text-shadow:0 0 12px rgba(240,217,173,.55)}
.if-orn::before{top:-9px}.if-orn::after{bottom:-9px}
.if-detail{position:absolute;inset:24px;border-left:1px solid rgba(240,217,173,.2);border-right:1px solid rgba(240,217,173,.2)}
.if-content{position:absolute;z-index:4;left:50%;top:50%;width:min(620px,calc(100vw - 56px));display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 24px;transform:translate(-50%,-50%);color:#e9e4da;transition:opacity .75s ease}
.if-eyebrow{color:#c7b69a;font-size:10px;letter-spacing:.36em;margin-bottom:30px;opacity:0;animation:rise .9s .25s forwards}
.if-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5.1vw,68px);line-height:1.45;letter-spacing:-.055em;margin:0;text-shadow:0 4px 35px rgba(0,0,0,.25);opacity:0;animation:rise 1.1s .4s forwards}
.if-title span{display:block}
.if-sub{margin:24px 0 0;color:#bcb5a9;font-size:clamp(10px,1.05vw,13px);letter-spacing:.08em;line-height:1.9;font-weight:300;opacity:0;animation:rise 1s .65s forwards}
.intro-frame.opened .if-frame{opacity:0;transform:translate(-50%,-50%) scale(.97);border-color:transparent;box-shadow:0 0 72px rgba(240,217,173,.75)}
.intro-frame.opened .if-content{opacity:0;transition-delay:.12s}

.shards{position:fixed;inset:0;z-index:70;pointer-events:none;perspective:1000px;display:none}
.shards.on{display:block}
.shard{position:absolute;inset:0;background:rgba(22,22,20,.97);border:2px solid rgba(240,217,173,.92);clip-path:polygon(var(--clip));opacity:0;backface-visibility:hidden;box-shadow:inset 0 0 16px rgba(240,217,173,.2),0 0 10px rgba(240,217,173,.08)}
.shards.on .shard{animation:shatter 1.65s cubic-bezier(.15,.72,.18,1) var(--delay,0ms) forwards}
@keyframes shatter{
  0%{opacity:1;transform:translate3d(0,0,0) rotateX(0) rotateY(0) rotateZ(0) scale(1);filter:brightness(1.6)}
  7%{opacity:1;filter:brightness(2.1)}
  100%{opacity:0;filter:brightness(.72);transform:translate3d(var(--tx),var(--ty),var(--tz)) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(.025)}
}
@media(max-width:600px){
  .if-frame{width:calc(100vw - 34px);height:min(430px,calc(100svh - 50px));min-height:350px;border-width:5px}
  .if-orn{inset:10px}.if-detail{inset:18px}.if-sub{max-width:290px}.if-eyebrow{letter-spacing:.22em}
}

.portal{position:fixed;z-index:60;pointer-events:none;border:2px solid rgba(240,217,173,.95);border-radius:2px;
  box-shadow:0 0 0 1px rgba(80,60,30,.35),0 0 46px rgba(255,226,170,.6),inset 0 0 34px rgba(255,226,170,.35);opacity:0;transition:opacity .6s ease}
.portal.on{opacity:1}
.portal.grow{opacity:0;transition:left 1.5s cubic-bezier(.75,0,.2,1),top 1.5s cubic-bezier(.75,0,.2,1),width 1.5s cubic-bezier(.75,0,.2,1),height 1.5s cubic-bezier(.75,0,.2,1),opacity .5s ease 1.05s}

.topbar{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .6s,transform .6s}
.topbar.on{opacity:1;transform:none}
.topbar.on .pill,.topbar.on .brand{pointer-events:auto}
.brand{position:absolute;left:clamp(16px,3vw,36px);top:12px;font-size:10px;letter-spacing:.34em;color:var(--ink)}
.topbar.no-brand .brand{display:none}

.pill{display:flex;align-items:center;gap:clamp(18px,3.6vw,56px);height:46px;padding:0 clamp(24px,3.8vw,56px);border-radius:99px;
  background:var(--g-bg);border:1px solid var(--g-line);
  backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow)}
.pill button{position:relative;padding:6px 1px;font-size:11.5px;letter-spacing:.07em;color:rgba(46,38,29,.74);transition:color .25s}
.pill button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;border-radius:2px;background:currentColor;transform:scaleX(0);transition:transform .3s ease}
.pill button:hover{color:var(--ink)}
.pill button.active{color:var(--ink);font-weight:700}
.pill button.active::after{transform:scaleX(1)}

.intro{background:var(--night)}
.intro .cam{filter:brightness(.26) blur(9px) saturate(.8);transition:filter 1.8s ease}
.intro.lit .cam{filter:none}
.intro::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(12,8,4,.6) 100%)}
.street-glow{position:absolute;left:545px;top:230px;width:650px;height:700px;background:radial-gradient(closest-side,rgba(255,226,180,.34),rgba(255,226,180,0));mix-blend-mode:screen;opacity:0;transition:opacity 1.6s;pointer-events:none}
.intro.lit .street-glow{opacity:1}
.street-poster{position:absolute;left:731px;top:300px;width:278px;height:452px;opacity:0;pointer-events:none;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.22),0 18px 34px rgba(0,0,0,.4);transition:opacity 1.2s ease,box-shadow .4s}
.street-poster img{display:block;width:100%;height:100%}
.intro.lit .street-poster{opacity:1}
.intro.lit .street-poster img{animation:flick 1.6s steps(1,end) both}
@keyframes flick{0%{filter:brightness(.3)}8%{filter:brightness(1)}12%{filter:brightness(.4)}20%{filter:brightness(1)}26%{filter:brightness(.55)}34%,100%{filter:brightness(1.03)}}
.intro.home .street-poster{pointer-events:auto}
.intro.home .street-poster:hover{box-shadow:0 0 0 1px rgba(0,0,0,.22),0 0 70px rgba(255,226,180,.45),0 18px 34px rgba(0,0,0,.4)}
.street-poster::after{content:"";position:absolute;inset:-14px;border:1px solid rgba(255,226,180,.75);opacity:0;pointer-events:none}
.intro.home .street-poster::after{animation:pulse 2.6s 1s ease-out infinite}
@keyframes pulse{0%{opacity:0;transform:scale(.98)}35%{opacity:1}100%{opacity:0;transform:scale(1.07)}}
.intro-top{position:absolute;z-index:3;top:calc(22px + env(safe-area-inset-top,0px));left:clamp(16px,3vw,36px);right:clamp(16px,3vw,36px);display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:.32em;color:#efe3cf;opacity:.8}
.ticket{position:absolute;z-index:2;left:50%;top:49%;width:var(--tw);transform:translate(-50%,-50%);filter:drop-shadow(0 26px 30px rgba(0,0,0,.55));transition:opacity .25s}
.ticket img{display:block;width:100%;height:auto;animation:float 6.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.2%) rotate(-.35deg)}}
.ticket:hover img{filter:brightness(1.04)}
.intro.crack .ticket img{animation:crack .26s steps(3) both}
@keyframes crack{0%{transform:translate(0,0)}33%{transform:translate(-.6%,.4%) rotate(-.6deg)}66%{transform:translate(.5%,-.3%) rotate(.5deg)}100%{transform:none}}
.intro.torn .ticket{opacity:0;pointer-events:none}
.intro.no-ticket .ticket,.intro.no-ticket .torn-ticket{display:none}
.torn-ticket{position:absolute;z-index:2;left:calc(50% + var(--tw) * .042);top:49%;width:calc(var(--tw) * .937);transform:translate(-50%,-50%) scale(.985);opacity:0;pointer-events:none;filter:drop-shadow(0 26px 30px rgba(0,0,0,.5));transition:opacity .2s,transform .7s cubic-bezier(.2,.8,.2,1)}
.torn-ticket img{display:block;width:100%;height:auto}
.intro.torn .torn-ticket{opacity:1;transform:translate(-50%,-50%) rotate(-.8deg)}
.intro.home .torn-ticket{opacity:0;transform:translate(-50%,-30%) rotate(-3deg) scale(.94);transition:opacity .7s,transform 1s cubic-bezier(.5,0,.6,1)}
.skip{position:absolute;z-index:4;right:clamp(16px,3vw,36px);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:10px 18px;border-radius:99px;background:var(--g-bg);border:1px solid var(--g-line);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow);font-size:10px;letter-spacing:.2em;color:#f6ecdb;transition:background .25s}
.skip:hover{background:var(--g-bg-hi)}

.street-poster::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,250,236,.75) 50%,transparent 65%);background-size:260% 100%;background-position:160% 0;opacity:0}
.intro.opening .street-poster::before{animation:shine .9s ease-out both}
@keyframes shine{0%{opacity:1;background-position:160% 0}100%{opacity:1;background-position:-60% 0}}
.intro.opening .cam{filter:brightness(.5) blur(2px);transition:filter 1.4s ease}
.intro.opening .street-poster{box-shadow:0 0 0 1px rgba(0,0,0,.22),0 0 90px rgba(255,226,180,.7)}
.intro.opening .street-poster::after{animation:none;opacity:0}
.intro.opening .skip,.intro.opening .intro-top{opacity:0;pointer-events:none;transition:opacity .4s}

.cam{position:absolute;inset:0;overflow:hidden}
.pearl{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:soft-light;opacity:.85;
  background:linear-gradient(110deg,rgba(255,176,226,0) 0%,rgba(255,226,170,.6) 22%,rgba(180,236,255,.55) 42%,rgba(236,206,255,.6) 62%,rgba(255,244,214,.5) 80%,rgba(255,176,226,0) 100%);
  background-size:260% 100%;animation:pearl 16s ease-in-out infinite alternate}
@keyframes pearl{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.cam.arrive{animation:arrive 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{transform:scale(1.14);filter:blur(6px)}to{transform:none;filter:none}}
.stage{position:absolute;inset:0;transform-origin:0 0;touch-action:none}
.stage.zooming{transition:transform 1.3s cubic-bezier(.7,0,.25,1)}
.tilt{position:absolute;inset:0;transform-origin:50% 50%;pointer-events:none}
.tilt button{pointer-events:auto}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.plate{position:absolute;left:0;top:0;display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.spot{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,180,.6),rgba(255,226,180,0));mix-blend-mode:screen;animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
.sun{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,222,160,.5) 45%,transparent 60%);background-size:260% 100%;mix-blend-mode:soft-light;animation:sun 16s ease-in-out infinite alternate;pointer-events:none}
@keyframes sun{from{background-position:100% 0}to{background-position:0 0}}
.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.statues{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .5s}
.screen-copy{position:absolute;z-index:5;left:clamp(16px,4vw,56px);top:calc(92px + env(safe-area-inset-top,0px));pointer-events:none;animation:rise 1.2s .5s cubic-bezier(.2,.7,.2,1) both}
.screen-copy small{font-size:10px;letter-spacing:.32em;color:var(--ink-soft)}
.screen-copy h2{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.6vw,34px);letter-spacing:-.02em;margin:10px 0 0;color:var(--ink)}

.window{position:absolute;overflow:hidden;background:#cdb894}
.window .view{position:absolute;inset:-14%;background:var(--img-gallery) center/cover;transition:filter .5s}
.window .view::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,240,215,.35),transparent 40%,rgba(60,40,20,.25))}
.window[data-r="1"] .view{background-position:30% 50%;filter:hue-rotate(-8deg) saturate(1.08)}
.window[data-r="2"] .view{background-position:75% 50%;filter:sepia(.2) brightness(.9) contrast(1.05)}
.window .wl{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-family:var(--serif);font-size:calc(15px / var(--s,1));letter-spacing:.2em;color:#fff;text-shadow:0 1px 10px rgba(60,40,20,.5)}
.layer:has(.frame-btn[data-r="0"]:hover) .window[data-r="0"] .view,
.layer:has(.frame-btn[data-r="1"]:hover) .window[data-r="1"] .view,
.layer:has(.frame-btn[data-r="2"]:hover) .window[data-r="2"] .view{filter:brightness(1.15)}
.frame-btn{position:absolute;border-radius:2px}
.flabel{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:calc(11px / var(--s,1));line-height:1.7;color:var(--ink);pointer-events:none}
.flabel b{display:block;font-weight:500;letter-spacing:.3em;font-size:1.05em}
.flabel span{color:var(--ink-soft);letter-spacing:.04em}

.cshadow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(60,38,18,.4),transparent);pointer-events:none}
.hot{position:absolute;border-radius:10px}
.hot{cursor:pointer}
.hot.has{cursor:grab;touch-action:none}
.hot.has:active{cursor:grabbing}
.stage.explore{cursor:grab}
.stage.explore.grabbing{cursor:grabbing}
.stand{position:absolute;left:50%;top:0;aspect-ratio:200/260;transform:translateX(-50%);transition:opacity .6s;pointer-events:none}
.stand .bust{display:block;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(60,40,20,.25))}
.hot.ready .stand{opacity:0}
.tag{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6em;white-space:nowrap;font-size:calc(10.5px / var(--s,1));letter-spacing:.06em;padding:.5em 1.1em .5em .5em;border-radius:99px;background:rgba(252,248,240,.86);color:var(--ink);box-shadow:0 .5em 1.4em rgba(60,40,20,.2);transition:transform .3s,background-color .3s}
.tag i{display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--paper);font-style:normal;font-size:.95em}
.hot:hover .tag,.hot:focus-visible .tag{transform:translateX(-50%) translateY(-.4em);background:#fff}
.hot.empty .tag{background:rgba(252,248,240,.6);color:var(--ink-soft)}
.hot.empty .tag i{background:rgba(46,38,29,.45)}
.stage[data-room="1"] .tint{filter:hue-rotate(-7deg) saturate(1.1) brightness(.98)}
.stage[data-room="2"] .tint{filter:sepia(.18) brightness(.92) contrast(1.06)}
.cam.switching{opacity:0;transition:opacity .35s}
.room-arrow{position:absolute;z-index:6;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--g-bg);border:1px solid var(--g-line);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow);font-size:16px;transition:background .25s,opacity .25s}
.room-arrow:hover{background:var(--g-bg-hi)}
.room-arrow:disabled{opacity:0;pointer-events:none}
.room-arrow.prev{left:clamp(12px,2.5vw,32px)}.room-arrow.next{right:clamp(12px,2.5vw,32px)}

.detail{position:absolute;z-index:20;inset:0;display:none;align-items:center;justify-content:center;gap:clamp(36px,9vw,150px);padding:96px 6vw 40px;
  background:radial-gradient(ellipse 46% 70% at 32% 56%,rgba(255,214,160,.24),transparent 70%),rgba(84,58,34,.30);
  backdrop-filter:blur(16px) saturate(1.05);-webkit-backdrop-filter:blur(16px) saturate(1.05)}
.detail.on{display:flex;animation:fadeIn .45s both}
.d-stage{position:relative;width:min(44vw,600px);height:min(80vh,720px);display:flex;flex-direction:column;align-items:center}
.d-model{position:relative;flex:1;width:100%;min-height:0}
.d-model::before{content:"";position:absolute;inset:-4% 0 0;background:radial-gradient(closest-side,rgba(255,228,176,.62),rgba(255,228,176,.18) 55%,rgba(255,228,176,0));pointer-events:none}
.d-model::after{content:"";position:absolute;left:50%;bottom:1%;width:58%;height:5%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(40,24,10,.55),rgba(40,24,10,0));filter:blur(5px);pointer-events:none}
.d-model canvas{position:absolute;inset:0;z-index:1;width:100%;height:100%;cursor:grab;touch-action:none}
.d-model canvas:active{cursor:grabbing}
.d-model .bust{position:absolute;z-index:1;left:50%;bottom:0;height:78%;transform:translateX(-50%)}
.d-card{width:min(366px,88vw);padding:20px 24px 24px;border-radius:14px;background:rgba(66,46,30,.66);border:1px solid rgba(255,255,255,.16);color:#f8efe0;box-shadow:0 30px 60px rgba(20,12,4,.32),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.d-top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.2);font-size:13px;color:rgba(248,239,224,.82)}
.d-card h3{font-weight:500;font-size:34px;line-height:1.2;letter-spacing:-.01em;margin:16px 0 0;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.2)}
.d-card p{margin:16px 0 0;min-height:5.4em;font-size:15.5px;font-weight:500;line-height:1.75;color:#fdf6ea}
.portfolio{display:block;margin-top:22px;padding:14px 20px;text-align:center;background:var(--g-bg);border:1px solid var(--g-line);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow);border-radius:99px;font-size:15px;font-weight:700;letter-spacing:.04em;text-decoration:none;transition:background .25s}
.portfolio:hover{background:var(--g-bg-hi)}
.portfolio.off{opacity:.5;pointer-events:none}
.d-close{position:absolute;right:clamp(14px,3vw,36px);top:calc(80px + env(safe-area-inset-top,0px));width:42px;height:42px;border-radius:50%;background:var(--g-bg);border:1px solid var(--g-line);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);box-shadow:var(--g-shadow);font-size:22px;line-height:1;color:#fbf3e4;transition:background .25s}
.d-close:hover{background:var(--g-bg-hi)}
.d-nav{position:absolute;top:50%;width:40px;height:40px;transform:translateY(-50%);font-size:20px;line-height:1;color:rgba(250,240,224,.9);text-shadow:0 1px 8px rgba(40,24,10,.5);transition:transform .25s,color .25s}
.d-nav:hover{color:#fff;transform:translateY(-50%) scale(1.18)}
.d-nav.prev{left:clamp(10px,2vw,28px)}.d-nav.next{right:clamp(10px,2vw,28px)}

.list{background:#f6f5f0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-inner{max-width:1240px;margin:0 auto;padding:112px 6% 90px}
.list h2{font-family:var(--sans);font-weight:500;font-size:clamp(40px,4.6vw,58px);line-height:1;letter-spacing:-.01em;margin:0 0 22px;color:#2a2622}
.tools{display:flex;justify-content:space-between;align-items:center;gap:16px}
.search-box{position:relative;display:block;width:min(275px,100%)}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#4a443d;pointer-events:none}
.search{width:100%;height:36px;padding:0 16px 0 40px;border:1px solid rgba(46,38,29,.5);border-radius:99px;background:transparent;font:inherit;font-size:14px;color:var(--ink);transition:border-color .25s,background .25s}
.search::placeholder{color:#3a342d}
.search:focus{outline:none;border-color:var(--ink);background:rgba(255,255,255,.55)}
.total{font-size:11.5px;color:#6b6258;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px 22px;margin-top:26px}
.card{text-align:left;display:flex;flex-direction:column}
.card .thumb{position:relative;aspect-ratio:1/.8;transition:transform .35s}
.card .thumb::after{content:"";position:absolute;left:50%;bottom:1%;width:50%;height:5%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(60,40,20,.28),rgba(60,40,20,0));filter:blur(3px);pointer-events:none}
.card .thumb img,.card .thumb svg{position:absolute;z-index:1;left:50%;bottom:0;height:94%;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(60,40,20,.12))}
.card .thumb.live{cursor:grab}
.card .thumb.live:active{cursor:grabbing}
.card .thumb canvas{position:absolute;z-index:1;left:50%;top:0;height:100%;width:auto;aspect-ratio:1;transform:translateX(-50%);touch-action:pan-y}
.card:hover .thumb{transform:translateY(-4px)}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.card .meta b{font-family:var(--sans);font-weight:700;font-size:14px;color:#2a2622}
.card .meta em{font-style:normal;font-size:11px;color:#6b6258}
.card .gal{margin-top:5px;font-size:10.5px;letter-spacing:.03em;color:#6b6258}
.empty-msg{margin-top:30px;color:var(--ink-soft);font-size:13px}

.topbar[data-theme="light"] .pill{background:rgba(255,255,255,.32);border:1px solid rgba(46,38,29,.52);box-shadow:0 6px 22px rgba(60,40,20,.08),inset 0 1px 0 rgba(255,255,255,.8)}

@media(max-width:760px){
  .brand{display:none}
  .pill{height:42px;gap:12px;padding:0 16px}
  .pill button{font-size:10px;letter-spacing:.02em}
  .intro-top span:last-child{display:none}
  .screen-copy{top:calc(74px + env(safe-area-inset-top,0px))}
  .room-arrow{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:none}
  .detail{flex-direction:column;justify-content:flex-start;gap:14px;padding:110px 16px 24px;overflow-y:auto}
  .d-stage{width:100%;height:44vh;flex:none}
  .d-close{top:calc(66px + env(safe-area-inset-top,0px))}
  .d-nav{top:30%}
  .list-inner{padding:92px 20px 60px}
  .list h2{font-size:38px}
  .tools{flex-direction:column;align-items:stretch;gap:12px}
  .total{align-self:flex-end}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
}

    <div class="if-grain"></div>

  <section class="screen" id="lobby" aria-label="로비">

            <div id="lobby-spots"></div>
          </div>
          <div class="layer" data-depth="1" id="lobby-front">

            <div id="frame-btns"></div>
          </div>
        </div>
        <canvas class="dust"></canvas>
      </div>
    </div>
    <div class="screen-copy"><h2>세 개의 공간, 서로 다른 시선</h2></div>
  </section>

  <section class="screen" id="gallery" aria-label="전시실">
    <div class="cam" id="gallery-cam">
      <div class="pearl" aria-hidden="true"></div>
      <div class="stage" id="gallery-stage" data-room="0">
        <div class="tilt">
          <div class="layer tint" data-depth="1" id="gallery-back">
            <img class="plate" data-asset="gallery" alt="" style="width:2000px;height:1126px">
            <div id="gallery-spots"></div>
          </div>
          <div class="layer tint" data-depth="1">
            <img class="plate" data-asset="pedestals" alt="" style="width:2000px;height:1126px">
            <div id="shadows"></div>
          </div>
        </div>

        <div class="tilt"><div class="layer" data-depth="1" id="hots"></div></div>
        <canvas class="dust"></canvas>
      </div>
    </div>
    <div class="screen-copy"><small id="g-sub">STUDENT 01 — 05</small><h2 id="g-title">GALLERY 01</h2></div>
    <button class="room-arrow prev" id="room-prev" type="button" aria-label="이전 전시실">←</button>
    <button class="room-arrow next" id="room-next" type="button" aria-label="다음 전시실">→</button>

    <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <button class="d-close" id="d-close" type="button" aria-label="닫기">×</button>
      <button class="d-nav prev" id="d-prev" type="button" aria-label="이전 학생">←</button>

      </div>
      <div class="d-card">

        <h3 id="d-name"></h3>
        <p id="d-desc"></p>
        <a class="portfolio" id="d-portfolio" target="_blank" rel="noopener">포트폴리오 열기 ↗</a>
      </div>
    </div>
  </section>

  <section class="screen list" id="list" aria-label="작가 목록">
    <div class="list-inner">

          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input class="search" id="search" type="search" placeholder="학생 이름 검색" autocomplete="off">

      <p class="empty-msg" id="empty" hidden>찾는 이름이 없어요. 이름을 다시 확인해 주세요.</p>

  <nav class="topbar" id="topbar" aria-label="전시 메뉴">
